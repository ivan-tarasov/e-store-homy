<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#fff7ed"/>
      <stop offset="55%" stop-color="#ffe4c4"/>
      <stop offset="100%" stop-color="#ffb878"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ff8c42"/>
      <stop offset="100%" stop-color="#e57000"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#1f2235" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect x="0" y="0" width="780" height="640" fill="url(#dots)"/>

  <polygon points="1180,0 1600,0 1600,640 980,640" fill="url(#orange)"/>
  <ellipse cx="1340" cy="320" rx="360" ry="290" fill="url(#glow)"/>

  <circle cx="1080" cy="120" r="44" fill="#ffd9b3" opacity="0.55"/>
  <circle cx="1520" cy="540" r="68" fill="#ffd9b3" opacity="0.55"/>
  <circle cx="1230" cy="540" r="28" fill="#ffffff" opacity="0.55"/>
  <circle cx="1450" cy="100" r="22" fill="#ffffff" opacity="0.45"/>
</svg>
